{% extends "base.html" %}
{% block content %}
<section class="card" style="padding:34px;text-align:center;max-width:640px;margin:30px auto">
  <div class="ring" id="spin" style="--v:25;margin:0 auto 18px;animation:spin 1s linear infinite"><b></b></div>
  <h2 id="msg">Iniciando auditoría…</h2>
  <p class="muted" style="word-break:break-all">{{ url }}</p>
  <ul id="log" class="muted small" style="list-style:none;padding:0;margin:14px 0 0"></ul>
  <p class="small muted">Suele tardar entre 30 segundos y 2 minutos.</p>
</section>
<style>@keyframes spin{to{transform:rotate(360deg)}}</style>
<script>
const msg = document.getElementById('msg'), log = document.getElementById('log');
function fail(t){ msg.textContent = t; document.getElementById('spin').style.animation = 'none'; }
const steps = ['Descargando la página principal…','Rastreando páginas internas clave…','Revisando robots.txt, sitemap y llms.txt…',
  'Probando el acceso de los bots de IA…','Midiendo velocidad móvil…','Consultando a las IAs…','Evaluando SEO local, GEO y AEO…','Generando informe…'];
let k = 0; msg.textContent = steps[0];
const tick = setInterval(() => { if (k < steps.length - 1) { const li = document.createElement('li'); li.textContent = '✓ ' + steps[k]; log.appendChild(li); k++; msg.textContent = steps[k]; } }, 7000);
const fd = new FormData(); const form = {{ form|default({})|tojson }};
Object.entries(form).forEach(([a, b]) => fd.append(a, b));
fetch({{ endpoint|default('/api/run')|tojson }}, {method: 'POST', body: fd}).then(async r => {
  clearInterval(tick);
  let j; try { j = await r.json(); } catch (e) { return fail('La auditoría tardó demasiado o se cortó. Inténtalo de nuevo.'); }
  if (j.redirect) { location.replace(j.redirect); return; }
  if (j.html) { document.open(); document.write(j.html); document.close(); return; }
  fail(j.error || 'No se pudo completar la auditoría.');
  if (r.status === 429) log.insertAdjacentHTML('afterend', '<p><a class="btn" href="/entrar/?modo=registro">Crear cuenta gratis</a></p>');
}).catch(e => { clearInterval(tick); fail('La auditoría tardó demasiado o se cortó. Inténtalo de nuevo.'); });
</script>
{% endblock %}
