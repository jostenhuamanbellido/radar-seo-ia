<style>
:root{
  --bg:#f4f5f1;--surface:#ffffff;--surface-2:#eef0ea;--ink:#16211d;--muted:#5d6b64;--line:#dde2d9;
  --accent:#0f6b52;--accent-ink:#ffffff;--ok:#1d8a5b;--warn:#c27c0e;--fail:#c4372d;--info:#6b7a99;
  --ring-track:#e3e7df;--shadow:0 1px 2px rgba(20,30,25,.06),0 4px 16px rgba(20,30,25,.05);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0f1513;--surface:#161e1b;--surface-2:#1d2723;--ink:#e6ece8;--muted:#9aa8a1;--line:#2a3631;
  --accent:#3fc59a;--accent-ink:#0b1310;--ok:#43c38a;--warn:#e4a83a;--fail:#ef6a5f;--info:#93a1c4;
  --ring-track:#25302c;--shadow:none;
}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:var(--accent)}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
.top{border-bottom:1px solid var(--line);background:var(--surface)}
.top .wrap{display:flex;align-items:center;gap:16px;height:60px}
.logo{font-weight:800;letter-spacing:-.02em;font-size:18px;color:var(--ink);text-decoration:none;display:flex;align-items:center;gap:8px}
.logo i{display:inline-block;width:22px;height:22px;border-radius:50%;border:3px solid var(--accent);position:relative}
.logo i:after{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--accent)}
.top nav{margin-left:auto;display:flex;gap:16px;font-size:14px}
.top nav a{color:var(--muted);text-decoration:none}.top nav a:hover{color:var(--ink)}
h1{font-size:28px;letter-spacing:-.02em;margin:0 0 4px;line-height:1.2}
h2{font-size:20px;letter-spacing:-.01em;margin:0 0 14px}
h3{font-size:16px;margin:0 0 8px}
.muted{color:var(--muted)}.small{font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;box-shadow:var(--shadow);margin-bottom:18px}
.btn{display:inline-flex;align-items:center;gap:6px;background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:10px 16px;font:600 14px system-ui,sans-serif;text-decoration:none;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.6;cursor:wait}
input[type=text],input[type=url],textarea{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:15px system-ui,sans-serif}
textarea{min-height:84px;resize:vertical}
label{font-size:13px;font-weight:600;color:var(--muted);display:block;margin:0 0 6px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:820px){.g2,.g3,.g4{grid-template-columns:1fr}}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill.local{color:#2a6fb0}.pill.geo{color:#7a4bc2}.pill.aeo{color:#b5562a}.pill.ai{color:var(--accent)}
/* anillos de puntaje */
.ring{--v:0;--c:var(--accent);width:92px;height:92px;border-radius:50%;display:grid;place-items:center;flex:none;
  background:radial-gradient(closest-side,var(--surface) 78%,transparent 79% 100%),conic-gradient(var(--c) calc(var(--v)*1%),var(--ring-track) 0)}
.ring b{font-size:26px;letter-spacing:-.03em}
.ring.big{width:150px;height:150px}.ring.big b{font-size:44px}
.ring.na{--v:0}.ring.na b{color:var(--muted);font-size:20px}
.score{display:flex;align-items:center;gap:14px}
.score .t{font-weight:700}
.delta{font-size:12px;font-weight:700}.delta.up{color:var(--ok)}.delta.down{color:var(--fail)}
.hero{display:flex;gap:28px;align-items:center;flex-wrap:wrap}
.hero .pillars{flex:1;min-width:280px}
/* checks */
.check{display:grid;grid-template-columns:26px 1fr auto;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.check:first-of-type{border-top:0}
.dot{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800;color:#fff;margin-top:1px}
.dot.ok{background:var(--ok)}.dot.warn{background:var(--warn)}.dot.fail{background:var(--fail)}.dot.info{background:var(--info)}
.check .n{font-weight:600}
.check .d{color:var(--muted);font-size:13.5px;word-break:break-word}
.check .f{font-size:13.5px;margin-top:4px;padding:8px 10px;border-radius:8px;background:var(--surface-2)}
.check .p{font-size:13px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.table-scroll{overflow-x:auto}
.yes{color:var(--ok);font-weight:700}.no{color:var(--fail);font-weight:700}
details{border-top:1px solid var(--line);padding:10px 0}
details summary{cursor:pointer;font-weight:600;list-style:none;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
details summary::-webkit-details-marker{display:none}
.answer{white-space:pre-wrap;font-size:13.5px;background:var(--surface-2);padding:12px;border-radius:10px;max-height:320px;overflow:auto;margin:10px 0}
.tag{font-size:12px;font-weight:700;padding:1px 8px;border-radius:6px}
.tag.ok{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}
.tag.fail{background:color-mix(in srgb,var(--fail) 15%,transparent);color:var(--fail)}
.tag.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.prio{counter-reset:p;list-style:none;padding:0;margin:0}
.prio li{counter-increment:p;display:grid;grid-template-columns:30px 1fr;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.prio li>div,.check>div,.f,.d{min-width:0;overflow-wrap:anywhere}
.prio li:first-child{border-top:0}
.prio li:before{content:counter(p);width:26px;height:26px;border-radius:8px;background:var(--surface-2);display:grid;place-items:center;font-weight:800;font-size:13px}
.links a{margin-right:10px;font-size:13px;white-space:nowrap}
.meta-row{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:14px;color:var(--muted);margin-top:8px}
.meta-row b{color:var(--ink);font-weight:600}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.foot{color:var(--muted);font-size:12.5px;padding:24px 0 40px}
.bar{height:8px;border-radius:99px;background:var(--ring-track);overflow:hidden;min-width:80px}
.bar span{display:block;height:100%;background:var(--accent)}
@media print{.top,.actions,.noprint{display:none}.card{box-shadow:none;break-inside:avoid}}
</style>
